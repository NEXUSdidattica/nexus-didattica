<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="Immagini/logo_nexus.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <title>Imposta Nuova Password - NEXUS didattica</title>
    <style>
        body {
            background-color: #f8fafc;
            color: #0f172a;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card-reset {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 35px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }

        .card-reset h2 {
            margin-top: 10px;
            margin-bottom: 5px;
            color: #0284c7;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #334155;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            background-color: #f8fafc;
            color: #0f172a;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: #0284c7;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #0284c7;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.2s ease;
        }

        .btn-submit:hover {
            background-color: #0369a1;
        }

        .auth-footer-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
        }

        .auth-footer-link a {
            color: #0284c7;
            text-decoration: none;
        }

        .auth-footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <main class="card-reset">
        <div style="text-align: center; margin-bottom: 25px;">
            <a href="index.html">
                <img src="Immagini/logo_nexus.png" alt="Logo NEXUS" style="width: 55px; height: auto;">
            </a>
            <h2>Nuova Password</h2>
            <p style="font-size: 0.88rem; color: #64748b; margin-top: 5px;">Inserisci e conferma la tua nuova password
                d'accesso.</p>
        </div>

        <form action="#" method="POST">
            <div class="form-group">
                <label for="new-password">Nuova Password</label>
                <input type="password" id="new-password" name="password" placeholder="Almeno 8 caratteri" required>
            </div>

            <div class="form-group">
                <label for="confirm-password">Conferma Nuova Password</label>
                <input type="password" id="confirm-password" name="confirm_password" placeholder="Ripeti la password"
                    required>
            </div>

            <button type="submit" class="btn-submit">Aggiorna Password</button>
        </form>

        <div class="auth-footer-link">
            <a href="login.html"> Torna al Login</a>
        </div>
    </main>

    <!-- Script Firebase per salvare la nuova password -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, confirmPasswordReset } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Le tue credenziali Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAvRg1YYrVs3bHqPP3H2B3k9ADtes1ifSQ",
            authDomain: "nexus-didattica.firebaseapp.com",
            projectId: "nexus-didattica",
            storageBucket: "nexus-didattica.firebasestorage.app",
            messagingSenderId: "749996460911",
            appId: "1:749996460911:web:903a1747e0bea0ae99369a",
            measurementId: "G-JV2NMTLK3H"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Recupera il codice monouso dall'URL dell'email
        const urlParams = new URLSearchParams(window.location.search);
        const oobCode = urlParams.get('oobCode');

        const form = document.querySelector('form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const pass = document.getElementById('new-password').value;
            const confirmPass = document.getElementById('confirm-password').value;

            if (pass !== confirmPass) {
                alert("Le password inserite non coincidono!");
                return;
            }

            if (!oobCode) {
                alert("Link non valido o scaduto. Richiedi nuovamente il ripristino della password.");
                return;
            }

            try {
                await confirmPasswordReset(auth, oobCode, pass);
                alert("Password aggiornata con successo! Ora verrai reindirizzato al login.");
                window.location.href = "login.html";
            } catch (error) {
                console.error(error);
                alert("Errore durante il salvataggio o link scaduto. Riprova.");
            }
        });
    </script>

</body>

</html>
